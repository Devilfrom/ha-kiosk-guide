<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>时钟</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#000; color:#e8e8e8;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  #time {
    font-size: 22vw; font-weight: 200; letter-spacing: 2px; line-height: 1;
    color:#ffffff; text-shadow: 0 0 30px rgba(120,170,255,0.25);
  }
  #date { font-size: 5vw; font-weight: 300; color:#9aa7b5; margin-top: 1.5vh; }
  #foot { position:absolute; bottom: 3vh; font-size: 3.2vw; color:#5f6b78; }
</style>
</head>
<body>
  <div id="time">--:--</div>
  <div id="date"></div>
  <div id="foot">智能家居中枢 · Kiosk</div>
<script>
  function pad(n){ return (n<10?"0":"")+n; }
  function tick(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    document.getElementById("time").textContent = pad(h)+":"+pad(m);
    var w = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][d.getDay()];
    document.getElementById("date").textContent = d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+w;
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
