<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>连接中断 · 正在重试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#f4f8ff; -webkit-user-select:none; user-select:none;
    background:radial-gradient(circle at 75% 22%, rgba(150,180,255,.18) 0%, rgba(150,180,255,0) 45%),
               linear-gradient(180deg,#060b1e 0%,#101a38 55%,#1e1434 100%);
  }
  #wrap { width:100%; height:100%; display:flex; flex-direction:column;
          align-items:center; justify-content:center; text-align:center; }
  #dot { width:2.2vw; height:2.2vw; min-width:14px; min-height:14px; border-radius:50%;
         background:#8fc7ff; margin-bottom:4vh; opacity:.35;
         animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.25; transform:scale(.85)} 50%{opacity:.9; transform:scale(1.15)} }
  h1 { font-size:5.5vw; font-weight:300; letter-spacing:2px; }
  #sub { font-size:2.6vw; font-weight:300; opacity:.8; margin-top:2.2vh; }
  #hint { font-size:2.2vw; font-weight:300; opacity:.55; margin-top:5vh; }
  #foot { position:absolute; bottom:3vh; font-size:2.4vw; opacity:.5; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="dot"></div>
    <h1>服务暂不可用</h1>
    <div id="sub">无法连接到 Home Assistant，正在自动重试…</div>
    <div id="hint">准备重连</div>
    <div id="foot">智能家居中枢 · Kiosk</div>
  </div>
<script>
(function(){
  var hint = document.getElementById("hint");
  // 目标地址由 errorURL 的 ?target= 传入，页面本身不含任何内网信息
  var m = /(?:^|[?&])target=([^&]+)/.exec(location.search);
  if (!m) { hint.textContent = "等待设备自动重试"; return; }
  var target = decodeURIComponent(m[1]);
  var n = 20;
  setInterval(function(){
    n--;
    if (n > 0) { hint.textContent = n + " 秒后自动重连…"; }
    else { location.replace(target); }
  }, 1000);
})();
</script>
</body>
</html>
