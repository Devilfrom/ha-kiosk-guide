# 光感 / 开门 联动 Kiosk 平板屏幕 —— 脱敏示例（Home Assistant 2024.10+ 语法）
#
# 用途：开灯时提前点亮壁挂平板，关灯一段时间后提前关屏；开门时也点亮。
# 设计原则：**设备自己的定时休眠/唤醒作为兜底（最可靠）**，HA 只在必要时补刀。
# 光感（开灯点亮 / 关灯息屏）覆盖「除工作日 08:00–18:00 外的所有在家时段」
#   —— 傍晚 18:00–23:30、周末白天、夜间 23:30–07:00 都按光照控制；
#      仅上班时段（平板本就强制熄屏）不触发，避免和作息冲突、也不和 30 秒时钟屏保抢逻辑。
#
# 前置条件
#   1. 平板设置：远程管理 = 开；远程管理密码 = 强密码；来自本地网络的远程管理 = 开
#      （REST 默认端口 2323，命令 screenOff / screenOn）
#   2. 替换下面三个占位符；不要把填好的文件提交到公开仓库
#   3. REST 是 HTTP 明文，密码会经过局域网：只在可信内网使用，
#      最好在路由器上限制只有 HA 主机能访问平板的 2323 端口
#   4. <ILLUMINANCE_SENSOR> 需要一个以 lx 为单位的数值型光照度实体；
#      <DOOR_SENSOR> 需要一个 device_class=door 的二值实体（on=开门）
#   5. 定时作息本身在平板上用 Fully 的 sleepSchedule 配置（见《04 屏保与省电》），
#      本文件只负责“计划外的唤醒/关屏”。
#
# 实机验证结论：
#   screenOff -> 200 {"status":"OK"} + 屏幕 OFF
#   screenOn  -> 200 {"status":"OK"} + 屏幕 ON
#   即使平板已由定时休眠关屏，REST screenOn 也能把它点亮
#
# 已知限制：深夜设备进入深度 Doze 后 WiFi 可能省电，外部 REST 请求可能延迟或失败；
#           07:00 / 18:00 的定时唤醒走 AlarmManager，最可靠。最后两条自动化是保险补刀。

rest_command:
  kiosk_screen_on:
    url: "http://<TABLET_IP>:2323/?cmd=screenOn&password=<REMOTE_ADMIN_PASSWORD>&type=json"
    method: GET
    timeout: 10
  kiosk_screen_off:
    url: "http://<TABLET_IP>:2323/?cmd=screenOff&password=<REMOTE_ADMIN_PASSWORD>&type=json"
    method: GET
    timeout: 10

automation:
  - alias: "壁挂平板 - 开门唤醒（非工作日白天不触发）"
    triggers:
      - trigger: state
        entity_id: "<DOOR_SENSOR>"
        to: "on"            # 门打开
    conditions:
      - condition: not
        conditions:
          - condition: time
            after: "08:00:00"
            before: "18:00:00"
            weekday: [mon, tue, wed, thu, fri]
    actions:
      - action: rest_command.kiosk_screen_on
    mode: single

  - alias: "壁挂平板 - 开灯提前点亮（在家时段，排除工作日白天）"
    triggers:
      - trigger: numeric_state
        entity_id: "<ILLUMINANCE_SENSOR>"
        above: 30
        for: "00:00:30"
    conditions:
      - condition: not
        conditions:
          - condition: time
            after: "08:00:00"
            before: "18:00:00"
            weekday: [mon, tue, wed, thu, fri]
    actions:
      - action: rest_command.kiosk_screen_on
    mode: single

  - alias: "壁挂平板 - 关灯延时关屏（在家时段，排除工作日白天）"
    triggers:
      - trigger: numeric_state
        entity_id: "<ILLUMINANCE_SENSOR>"
        below: 5
        for: "00:10:00"
    conditions:
      - condition: not
        conditions:
          - condition: time
            after: "08:00:00"
            before: "18:00:00"
            weekday: [mon, tue, wed, thu, fri]
    actions:
      - action: rest_command.kiosk_screen_off
    mode: single

  - alias: "壁挂平板 - 早晨 07:00:30 补刀点亮"
    triggers:
      - trigger: time
        at: "07:00:30"
    actions:
      - action: rest_command.kiosk_screen_on
    mode: single

  - alias: "壁挂平板 - 傍晚 18:00:30 工作日补刀点亮"
    triggers:
      - trigger: time
        at: "18:00:30"
    conditions:
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
    actions:
      - action: rest_command.kiosk_screen_on
    mode: single

  - alias: "壁挂平板 - 工作日白天每5分钟确保熄屏（被唤醒也5分钟内关）"
    # Fully 的 sleepSchedule 是单次边界触发（08:00 睡、18:00 醒），窗口内若被
    # REST / 点屏 / 通知唤醒，不会自动再睡。这条每 5 分钟兜底发一次 screenOff，
    # 保证工作日 8-18 内屏幕最多亮 5 分钟就被关掉。screenOff 幂等，已关时无害。
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: time
        after: "08:00:00"
        before: "18:00:00"
        weekday: [mon, tue, wed, thu, fri]
    actions:
      - action: rest_command.kiosk_screen_off
    mode: single
